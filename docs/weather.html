<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather - Smart Irrigation System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🌱 Smart Irrigation</div>
      <div class="brand-sub">Precision Farming with ML</div>

      <a href="dashboard.html" class="nav-link" data-page="dashboard">📊 Dashboard</a>
      <a href="sensors.html" class="nav-link" data-page="sensors">📡 Sensor Monitoring</a>
      <a href="irrigation.html" class="nav-link" data-page="irrigation">💧 Irrigation Control</a>
      <a href="crops.html" class="nav-link" data-page="crops">🌾 Crops</a>
      <a href="weather.html" class="nav-link" data-page="weather">⛅ Weather</a>

      <div class="sidebar-footer">
        <div class="user-badge">Signed in as <strong id="userBadge"></strong></div>
        <button class="btn btn-outline" style="width:100%;" onclick="logout()">Log Out</button>
      </div>
    </aside>

    <main class="content">
      <h1 class="page-title">Weather</h1>
      <p class="page-subtitle">Live conditions for your farm's location (via Open-Meteo, no API key needed)</p>

      <div class="panel">
        <div class="inline-form">
          <div class="field">
            <label>City</label>
            <input type="text" id="cityInput" value="Madurai" placeholder="e.g. Madurai">
          </div>
          <button class="btn btn-primary" id="fetchWeatherBtn">Get Weather</button>
        </div>
        <span id="weatherMsg" class="form-message"></span>
      </div>

      <div class="grid" id="weatherCards" style="display:none;">
        <div class="card"><div class="label">Location</div><div class="value" id="wCity" style="font-size:18px;">--</div></div>
        <div class="card"><div class="label">Temperature</div><div class="value" id="wTemp">--</div></div>
        <div class="card"><div class="label">Humidity</div><div class="value" id="wHumidity">--</div></div>
        <div class="card"><div class="label">Rainfall Probability</div><div class="value" id="wRain">--</div></div>
        <div class="card"><div class="label">Wind Speed</div><div class="value" id="wWind">--</div></div>
      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireAuth();
    initLayout("weather");

    async function fetchWeather() {
      const city = document.getElementById("cityInput").value.trim() || "Madurai";
      try {
        const data = await apiFetch("/api/weather?city=" + encodeURIComponent(city));
        document.getElementById("weatherCards").style.display = "grid";
        document.getElementById("wCity").textContent = data.city + (data.country ? ", " + data.country : "");
        document.getElementById("wTemp").textContent = (data.temperature_c ?? "--") + " °C";
        document.getElementById("wHumidity").textContent = (data.humidity_percent ?? "--") + " %";
        document.getElementById("wRain").textContent = (data.rainfall_probability_percent ?? "--") + " %";
        document.getElementById("wWind").textContent = (data.wind_speed_kmh ?? "--") + " km/h";
        showMessage("weatherMsg", "", false);
      } catch (err) {
        showMessage("weatherMsg", err.message);
      }
    }

    document.getElementById("fetchWeatherBtn").addEventListener("click", fetchWeather);
    fetchWeather();
  </script>
</body>
</html>
