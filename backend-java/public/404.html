<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found • AgroPulse</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body class="auth-page">
  <div class="auth-card" style="text-align:center; max-width:440px;">
    <div style="width:48px; height:48px; border-radius:var(--radius-md); background:var(--sage-muted); color:var(--forest-800); display:inline-flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:14px;">
      <i class="fa-solid fa-compass" aria-hidden="true"></i>
    </div>
    <div style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--action-green); margin-bottom:4px;">
      HTTP 404 • Route Not Found
    </div>
    <h1 style="font-size:22px; font-weight:700; color:var(--text-primary); letter-spacing:-0.02em; margin-bottom:8px;">
      Page Not Found
    </h1>
    <p style="font-size:13.5px; color:var(--text-secondary); line-height:1.55; margin-bottom:20px;">
      The requested workspace route does not exist or has been moved. Return directly to your active farm dashboard.
    </p>
    <a href="dashboard.html" class="btn btn-primary btn-block btn-lg">
      <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
      <span>Return to Dashboard</span>
    </a>
    <div class="auth-footer" style="margin-top:16px;">
      <a href="privacy.html" style="color:var(--text-secondary); font-weight:500;">Privacy Policy</a>
      <span style="margin:0 6px;">&middot;</span>
      <a href="terms.html" style="color:var(--text-secondary); font-weight:500;">Terms &amp; Conditions</a>
    </div>
  </div>
</body>
</html>
